<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Quay phim có phụ đề</title>
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--card:#fff;--accent:#d93025;--mut:#666}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f0f0f0;--card:#1e1e1e;--mut:#aaa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));max-width:760px;margin-inline:auto}
h1{font-size:18px;margin:4px 0 10px}
.stage{position:relative;background:#000;border-radius:12px;overflow:hidden}
canvas{width:100%;height:auto;display:block;max-height:68vh;margin:auto}
video{display:none}
.rec{position:absolute;top:8px;right:10px;color:#fff;background:var(--accent);font-size:13px;padding:2px 10px;border-radius:99px;display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
button{font:inherit;padding:11px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid #8884}
button.on{background:#1a73e8;color:#fff;border:0}
button:disabled{opacity:.45}
textarea,select,input[type=text]{font:inherit;padding:8px;border-radius:8px;border:1px solid #8886;background:var(--card);color:var(--fg);width:100%}
textarea{min-height:130px}
label{display:flex;align-items:center;gap:6px;font-size:14px}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px}
.card small{color:var(--mut);display:block;margin-bottom:4px}
#msg{color:var(--mut);font-size:13px;margin-top:6px;min-height:18px}
.nav{display:none;gap:8px}
.nav button{flex:1}
</style>
</head>
<body>
<h1>🎥 Quay phim có phụ đề</h1>

<div class="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="rec" id="rec">● REC 00:00</div>
</div>

<div class="row nav" id="nav">
  <button class="sec" id="prev">◀ Câu trước</button>
  <button id="next">Câu tiếp ▶</button>
</div>

<div class="row">
  <button id="start">Bật camera</button>
  <button id="flip" class="sec" disabled>Đổi camera</button>
  <button id="rb" disabled>Bắt đầu quay</button>
  <button id="dl" class="sec" disabled>Lưu video</button>
</div>
<div id="msg"></div>

<div class="row">
  <button id="m1" class="on">🎤 Phụ đề theo giọng nói</button>
  <button id="m2" class="sec">📜 Đọc theo kịch bản</button>
</div>

<div class="card" id="scriptCard" style="display:none">
  <small>Kịch bản (mỗi dòng hoặc mỗi câu kết thúc bằng . ? ! là một phụ đề). Chạm vào video hoặc bấm "Câu tiếp" để chuyển câu.</small>
  <textarea id="script" placeholder="Dán kịch bản vào đây..."></textarea>
  <div class="row" style="margin:8px 0 0">
    <button class="sec" id="apply">Áp dụng kịch bản</button>
    <label><input type="checkbox" id="auto"> Tự chuyển câu khi tôi đọc xong</label>
  </div>
</div>

<div class="card">
  <small>Cài đặt</small>
  <div class="row" style="margin:0 0 8px">
    <div style="flex:1;min-width:140px"><small>Ngôn ngữ nhận dạng</small>
      <select id="lang"><option value="vi-VN">Tiếng Việt</option><option value="en-US">English</option></select></div>
    <div style="flex:1;min-width:140px"><small>Cỡ chữ phụ đề</small><input type="range" id="fs" min="3" max="7" step="0.5" value="4.5" style="width:100%"></div>
  </div>
  <div class="row" style="margin:0">
    <label><input type="checkbox" id="burn" checked> Ghi phụ đề vào video</label>
    <label><input type="checkbox" id="listen" checked> Nhận dạng giọng nói</label>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const v=$('v'),c=$('c'),ctx=c.getContext('2d');
let stream,facing='environment',rec,chunks=[],blobOut=null,live=false,t0=0,tick,running=false,wake=null;
let mode='speech',sents=[],idx=0,finals=[],interim='',lastT=0,cut=0,sr=null;
const say=t=>$('msg').textContent=t||'';
try{$('script').value=localStorage.getItem('qp_script')||''}catch(e){}

function norm(s){return s.toLowerCase().normalize('NFC').replace(/[.,!?;:"“”'‘’()\-–—…]/g,' ').split(/\s+/).filter(Boolean)}
function split(t){return t.split(/\n+/).flatMap(l=>l.match(/[^.!?…]+[.!?…]*/g)||[]).map(s=>s.trim()).filter(Boolean)}
function applyScript(){
  sents=split($('script').value);idx=0;
  try{localStorage.setItem('qp_script',$('script').value)}catch(e){}
  say(sents.length?('Đã nạp '+sents.length+' câu.'):'Kịch bản đang trống.');
}
function go(d){if(!sents.length)return;idx=Math.max(0,Math.min(sents.length-1,idx+d));cut=(finals.join(' ')+' '+interim).length}
$('apply').onclick=applyScript;
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
c.addEventListener('click',()=>{if(mode==='script')go(1)});

function setMode(m){
  mode=m;$('m1').className=m==='speech'?'on':'sec';$('m2').className=m==='script'?'on':'sec';
  $('scriptCard').style.display=m==='script'?'block':'none';$('nav').style.display=m==='script'?'flex':'none';
  if(m==='script'&&!sents.length)applyScript();
}
$('m1').onclick=()=>setMode('speech');$('m2').onclick=()=>setMode('script');

function caption(){
  if(mode==='script')return sents[idx]||'';
  if(Date.now()-lastT>5000)return '';
  return ((finals[finals.length-1]||'')+' '+interim).trim().split(/\s+/).slice(-22).join(' ');
}
function wrap(text,max){
  const words=text.split(/\s+/),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>max&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines;
}
function draw(){
  if(v.videoWidth){
    if(c.width!==v.videoWidth||c.height!==v.videoHeight){c.width=v.videoWidth;c.height=v.videoHeight}
    ctx.drawImage(v,0,0,c.width,c.height);
  }else{ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height)}
  const txt=caption();
  if(txt){
    const size=Math.round(c.width*parseFloat($('fs').value)/100);
    ctx.font='bold '+size+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const L=wrap(txt,c.width*0.9).slice(-4),lh=size*1.3,h=L.length*lh+size*0.6,top=c.height-h-c.height*0.04;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(c.width*0.03,top,c.width*0.94,h);
    ctx.fillStyle='#fff';L.forEach((l,i)=>ctx.fillText(l,c.width/2,top+size*0.3+lh*i+lh/2));
  }
  requestAnimationFrame(draw);
}

function startSR(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){say('Trình duyệt không hỗ trợ nhận dạng giọng nói, hãy dùng Chrome.');return}
  try{sr&&(sr.onend=null,sr.abort())}catch(e){}
  sr=new SR();sr.lang=$('lang').value;sr.continuous=true;sr.interimResults=true;
  sr.onresult=e=>{
    interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i],t=r[0].transcript.trim();
      if(r.isFinal){finals.push(t);if(finals.length>50)finals=finals.slice(-20),cut=0}else interim=t;
    }
    lastT=Date.now();
    if(mode==='script'&&$('auto').checked&&sents[idx]){
      const full=finals.join(' ')+' '+interim,heard=new Set(norm(full.slice(cut))),target=norm(sents[idx]);
      if(target.length&&target.filter(w=>heard.has(w)).length/target.length>=0.6&&idx<sents.length-1)go(1);
    }
  };
  sr.onend=()=>{if(stream&&stream.active&&$('listen').checked){try{sr.start()}catch(e){}}};
  sr.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')say('Chưa được cấp quyền nhận dạng giọng nói.')};
  try{sr.start()}catch(e){}
}
$('listen').onchange=()=>{if($('listen').checked&&stream)startSR();else try{sr&&(sr.onend=null,sr.abort())}catch(e){}};
$('lang').onchange=()=>{if(stream&&$('listen').checked)startSR()};

async function openCam(){
  try{
    stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},
      audio:{echoCancellation:true,noiseSuppression:true}
    });
    v.srcObject=stream;await v.play();
    $('start').textContent='Camera đang bật';$('rb').disabled=false;$('flip').disabled=false;
    if(!running){running=true;draw()}
    try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
    say('');
    if($('listen').checked)startSR();
  }catch(e){say('Không mở được camera/micro: '+(e.message||e.name)+'. Trang cần chạy qua HTTPS và được cấp quyền.')}
}
$('start').onclick=openCam;
$('flip').onclick=()=>{if(live){say('Hãy dừng quay trước khi đổi camera.');return}facing=facing==='user'?'environment':'user';openCam()};

$('rb').onclick=()=>{
  if(!live){
    chunks=[];blobOut=null;$('dl').disabled=true;
    let src=stream;
    if($('burn').checked){src=c.captureStream(30);stream.getAudioTracks().forEach(t=>src.addTrack(t))}
    const mt=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    rec=new MediaRecorder(src,mt?{mimeType:mt}:{});
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=()=>{blobOut=new Blob(chunks,{type:rec.mimeType||'video/webm'});$('dl').disabled=false;say('Đã quay xong, bấm "Lưu video".')};
    rec.start(1000);live=true;t0=Date.now();
    $('rb').textContent='Dừng quay';$('rec').style.display='block';
    tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('rec').textContent='● REC '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
  }else{
    rec.stop();live=false;clearInterval(tick);
    $('rb').textContent='Bắt đầu quay';$('rec').style.display='none';
  }
};
$('dl').onclick=()=>{
  if(!blobOut)return;
  const ext=blobOut.type.includes('mp4')?'mp4':'webm';
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blobOut);
  a.download='quay-phim-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.'+ext;
  document.body.appendChild(a);a.click();a.remove();
};
</script>
</body>
</html>
